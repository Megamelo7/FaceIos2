<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="-219 -22 1000 1000">
  <defs>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="120" y1="40" x2="520" y2="900">
      <stop offset="0" stop-color="#4aa3f7"/>
      <stop offset="0.45" stop-color="#1e82e9"/>
      <stop offset="1" stop-color="#1463c8"/>
    </linearGradient>
    <linearGradient id="light" gradientUnits="userSpaceOnUse" x1="200" y1="40" x2="420" y2="900">
      <stop offset="0" stop-color="#d3eafb"/>
      <stop offset="0.45" stop-color="#abd2f0"/>
      <stop offset="1" stop-color="#88b8e2"/>
    </linearGradient>
    <radialGradient id="headVol" gradientUnits="userSpaceOnUse" cx="330" cy="250" r="330">
      <stop offset="0.62" stop-color="#0a2a5c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a2a5c" stop-opacity="0.28"/>
    </radialGradient>
    <radialGradient id="headShine" gradientUnits="userSpaceOnUse" cx="230" cy="130" r="170">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headUnder" gradientUnits="userSpaceOnUse" x1="0" y1="400" x2="0" y2="525">
      <stop offset="0" stop-color="#0a2a5c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a2a5c" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="neckShade" gradientUnits="userSpaceOnUse" x1="0" y1="500" x2="0" y2="600">
      <stop offset="0" stop-color="#0a2a5c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0a2a5c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bodyVol" gradientUnits="userSpaceOnUse" cx="370" cy="700" r="230">
      <stop offset="0.55" stop-color="#0a2a5c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a2a5c" stop-opacity="0.16"/>
    </radialGradient>
    <linearGradient id="titanium" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b5f68"/>
      <stop offset="0.5" stop-color="#2c2f35"/>
      <stop offset="1" stop-color="#4a4e56"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="blur12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>

    <path id="headShape" d="M330 34 C430 30 520 60 565 130 C600 185 612 260 610 330 C608 410 580 470 520 498 C470 520 380 526 300 522 C200 516 120 490 100 420 C84 360 84 250 95 195 C115 110 200 40 330 34 Z"/>
    <path id="bodyShape" d="M240 500 C205 560 180 640 185 720 C188 760 190 790 195 820 C195 860 205 900 250 906 C300 910 345 905 352 870 C356 840 360 805 372 800 C386 805 390 840 394 870 C400 910 460 912 510 908 C560 902 566 870 562 830 C560 760 566 680 552 600 C545 560 530 520 510 500 Z"/>
    <clipPath id="head-clip"><use href="#headShape" xlink:href="#headShape"/></clipPath>
    <clipPath id="body-clip"><use href="#bodyShape" xlink:href="#bodyShape"/></clipPath>
    <!-- lado azul de la cara: lÃ­nea casi recta con el escalÃ³n de la nariz -->
    <clipPath id="face-blue">
      <path d="M-60 -20 L263 -20 L316 310 Q319 318 328 319 L368 325 Q377 327 380 335 L452 540 L-60 540 Z"/>
    </clipPath>
    <!-- cuerpo con los colores cruzados: celeste a la izquierda, azul a la derecha -->
    <clipPath id="body-light"><rect x="-60" y="480" width="440" height="460"/></clipPath>
  </defs>

  <!-- sombra en el piso -->
  <ellipse cx="380" cy="912" rx="215" ry="18" fill="#0f172a" opacity="0.16" filter="url(#blur12)"/>

  <!-- brazo que saluda (azul) -->
  <path d="M512 572 C580 562 640 486 668 412" fill="none" stroke="url(#blue)" stroke-width="84" stroke-linecap="round"/>
  <ellipse cx="662" cy="392" rx="22" ry="14" transform="rotate(-50 662 392)" fill="#fff" opacity="0.28" filter="url(#blur6)"/>

  <!-- brazo que sostiene el iPhone (celeste) -->
  <path d="M252 572 C204 590 152 606 114 620" fill="none" stroke="url(#light)" stroke-width="78" stroke-linecap="round"/>

  <!-- cuerpo -->
  <g clip-path="url(#body-clip)">
    <rect x="-60" y="480" width="840" height="460" fill="url(#blue)"/>
    <rect x="-60" y="480" width="840" height="460" fill="url(#light)" clip-path="url(#body-light)"/>
    <ellipse cx="373" cy="806" rx="12" ry="20" fill="#0a2a5c" opacity="0.25" filter="url(#blur6)"/>
    <rect x="-60" y="480" width="840" height="460" fill="url(#bodyVol)"/>
    <rect x="-60" y="480" width="840" height="460" fill="url(#neckShade)"/>
  </g>

  <!-- cabeza -->
  <g clip-path="url(#head-clip)">
    <rect x="-60" y="-20" width="840" height="560" fill="url(#light)"/>
    <rect x="-60" y="-20" width="840" height="560" fill="url(#blue)" clip-path="url(#face-blue)"/>
    <rect x="-60" y="-20" width="840" height="560" fill="url(#headVol)"/>
    <rect x="-60" y="-20" width="840" height="560" fill="url(#headUnder)"/>
    <rect x="-60" y="-20" width="840" height="560" fill="url(#headShine)"/>
  </g>

  <!-- cara -->
  <ellipse cx="238" cy="340" rx="19" ry="21" fill="#0b0f16"/>
  <ellipse cx="447" cy="298" rx="19" ry="21" fill="#0b0f16"/>
  <circle cx="244" cy="333" r="4.5" fill="#fff" opacity="0.55"/>
  <circle cx="453" cy="291" r="4.5" fill="#fff" opacity="0.55"/>
  <path d="M330 398 Q350 412 371 395" fill="none" stroke="#0b0f16" stroke-width="7" stroke-linecap="round"/>

  <!-- iPhone -->
  <g transform="translate(6 578) rotate(-10) scale(2.1)">
    <rect x="-52" y="-60" width="6" height="14" rx="2" fill="#3a3d44"/>
    <rect x="-52" y="-38" width="6" height="24" rx="2" fill="#3a3d44"/>
    <rect x="-52" y="-8" width="6" height="24" rx="2" fill="#3a3d44"/>
    <rect x="-48" y="-98" width="96" height="196" rx="20" fill="url(#titanium)"/>
    <rect x="-44" y="-94" width="88" height="188" rx="17" fill="#0a0a0c"/>
    <rect x="-41" y="-91" width="82" height="182" rx="14.5" fill="url(#wall)"/>
    <rect x="-14" y="-84" width="28" height="9" rx="4.5" fill="#000"/>
    <text x="0" y="-57" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Arial, sans-serif" font-size="9.5" letter-spacing="0.6" fill="#fff" opacity="0.92"><tspan font-weight="800">FACE</tspan><tspan font-weight="500"> iOS</tspan></text>
    <text x="0" y="-22" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">9:41</text>
    <circle cx="-25" cy="68" r="8" fill="#fff" opacity="0.22"/>
    <circle cx="25" cy="68" r="8" fill="#fff" opacity="0.22"/>
    <rect x="-16" y="84" width="32" height="3" rx="1.5" fill="#fff" opacity="0.85"/>
    <path d="M-41 -91 L10 -91 L-41 20 Z" fill="#fff" opacity="0.12"/>
  </g>

  <!-- la manito redonda agarra el borde del telÃ©fono -->
  <circle cx="112" cy="620" r="40" fill="url(#light)"/>
  <ellipse cx="102" cy="604" rx="14" ry="10" transform="rotate(-30 102 604)" fill="#fff" opacity="0.35" filter="url(#blur6)"/>
</svg>

